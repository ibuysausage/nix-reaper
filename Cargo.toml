[package]
name = "nix-reaper"
version = "0.1.0"
edition = "2021"
description = "Deep-clean a NixOS system: generations, boot entries, GC roots, and non-Nix bloat"
license = "MIT"

[[bin]]
name = "nix-reaper"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 2
